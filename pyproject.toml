[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elden-tracker"
version = "1.0.0"
description = "Elden Ring Save Progression Tracker and AI Guide"
readme = "README.md"
authors = [{ name = "Tarnished Developer" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
elden-tracker = "elden_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["elden_tracker*"]

[tool.setuptools.package-data]
elden_tracker = ["data/*.json"]
